name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SUPABASE_URL=https://mteznqxhksgyzetqclmi.supabase.co
          SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10ZXpucXhoa3NneXpldHFjbG1pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDQ3ODcsImV4cCI6MjEwNjI4MDc4N30.k8eZlKOQyxOE7miOi7sCdaLvRdI6BWJacRyP86vedPg
          LIVEKIT_URL=wss://selam-jgwrn9n6.livekit.cloud
          LIVEKIT_API_KEY=APIiemCPDaM4oYTL
          LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
          VOICE_TOKEN_SERVER_URL=https://olly-zbiv.onrender.com
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: olly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build split APKs (arm64, armeabi, x86_64)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: olly-split-apks
          path: build/app/outputs/flutter-apk/
          retention-days: 30
